<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SysMon</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    </head>

    <body class="custom-body">
        <div class="d-flex" style="min-height: 100vh;">

            <div class="sidebar p-3 flex-shrink-0"> 
                <h4 class="text-white mt-2 mb-4">SYSMON</h4>
                <hr>

                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
                            <img src="{{ url_for('static', filename='images/home.png') }}" class="sidebar-icon" alt="">
                            Overview
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/diagnostics" class="nav-link {% if request.path == '/diagnostics' %}active{% endif %}">
                            <img src="{{ url_for('static', filename='images/diagnostics.png') }}" class="sidebar-icon" alt="">
                            Diagnostics
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/about" class="nav-link {% if request.path == '/about' %}active{% endif %}">
                            <img src="{{ url_for('static', filename='images/about.png') }}" class="sidebar-icon" alt="">
                            About
                        </a>
                    </li>
                </ul>
            </div>

            <div class="flex-grow-1 p-4">
                {% block main %}
                {% endblock %}
            </div>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="{{ url_for('static', filename='script.js') }}"></script>
    </body>
</html>
